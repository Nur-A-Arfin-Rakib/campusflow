# .github/workflows/ci-cd.yml
# ─────────────────────────────────────────────────────────────────────────────
#  CampusFlow CI/CD Pipeline
#
#  On every Pull Request  → runs tests (blocks merge if tests fail)
#  On push to main        → runs tests, then triggers Render deploy
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    RENDER_DEPLOY_HOOK_URL  — from Render: Service → Settings → Deploy Hook
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Run backend tests ──────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run tests with coverage
        working-directory: server
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/

  # ── 2. Build frontend (catch build errors early) ──────────────────────────
  build-client:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: ''   # empty = use relative /api in production

  # ── 3. Deploy to Render (only on main branch, after tests pass) ───────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build-client]   # only runs if both jobs above pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
        # --fail makes curl exit with error if Render returns non-2xx

      - name: Deploy triggered
        run: echo "✅ Deploy triggered on Render. Check https://dashboard.render.com for status."

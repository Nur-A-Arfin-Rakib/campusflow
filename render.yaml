# routine-app/render.yaml
# ─────────────────────────────────────────────────────────────────────────────
#  One-click deploy on Render.com
#  Usage:
#    1. Push project to GitHub
#    2. Go to https://render.com → New → Blueprint
#    3. Connect your repo → Render reads this file automatically
#    4. Add your env vars in the Render dashboard after first deploy
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: campusflow-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: CLIENT_URL
        sync: false          # set after client is deployed
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ── Frontend (Static Site) ─────────────────────────────────────
  - type: web
    name: campusflow-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # Send all routes to index.html (React Router support)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: campusflow-server
          type: web
          property: host
